[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-hw02-code-generation"
version = "0.1.0"
description = "HSE NLP HW2 from-scratch encoder-decoder baseline"
requires-python = ">=3.11,<3.14"
dependencies = ["ipykernel>=6.29,<8", "pyarrow>=18", "nbformat>=5.10"]

[project.optional-dependencies]
gpu = ["torch>=2.11,<2.12", "wandb>=0.18", "tokenizers>=0.21,<0.24", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]
